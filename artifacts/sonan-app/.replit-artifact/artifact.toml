kind = "web"
previewPath = "/"
title = "السنن النبوية"
version = "1.0.0"
id = "artifacts/sonan-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25656

[services.development]
run = "pnpm --filter @workspace/sonan-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sonan-app", "run", "build" ]
publicDir = "artifacts/sonan-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25656"
BASE_PATH = "/"
